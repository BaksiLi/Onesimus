name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  vim:
    name: Vim / ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Vim
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes ca-certificates curl git vim-nox

      - name: Install Vim plugins
        env:
          HOME: ${{ runner.temp }}/onesimus-home
        run: |
          mkdir -p "$HOME/.vim/autoload"
          curl -fL --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            -o "$HOME/.vim/autoload/plug.vim" \
            https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim

          log="$RUNNER_TEMP/onesimus-plugin-install.log"
          if ! vim \
            --cmd 'let g:onesimus_usage_enabled=0 | let g:startify_disable_at_vimenter=1' \
            -Nu "$GITHUB_WORKSPACE/init.vim" -i NONE -n -es \
            -c 'for spec in values(g:plugs) | if has_key(spec, "do") | call remove(spec, "do") | endif | endfor' \
            -c 'PlugInstall --sync' \
            -c 'if !empty(filter(values(g:plugs), "!isdirectory(v:val.dir)")) | cquit | endif' \
            -c 'qa!' >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi

      - name: Reconcile production plugin artifacts
        env:
          HOME: ${{ runner.temp }}/onesimus-home
        run: |
          report="$RUNNER_TEMP/onesimus-plugin-update.report"
          log="$RUNNER_TEMP/onesimus-plugin-update.log"
          if ! ONESIMUS_UPDATE_REPORT="$report" vim \
            --cmd 'let g:onesimus_installing=1 | let g:onesimus_home_enabled=0 | let g:onesimus_usage_enabled=0 | let g:startify_disable_at_vimenter=1' \
            -Nu "$GITHUB_WORKSPACE/init.vim" -U NONE -i NONE -n -es \
            -S "$GITHUB_WORKSPACE/scripts/update_plugins.vim" \
            </dev/null >"$log" 2>&1; then
            cat "$log"
            test ! -f "$report" || cat "$report"
            exit 1
          fi
          test "$(sed -n '1p' "$report")" = OK
          sed -n '2p' "$report"

      - name: Run test suite
        env:
          HOME: ${{ runner.temp }}/onesimus-home
          VIM: vim
        run: sh tests/run.sh
