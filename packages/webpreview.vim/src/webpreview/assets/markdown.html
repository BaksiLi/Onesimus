<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebPreview</title>
<link rel="stylesheet" href="./markdown/katex.min.css">
<link rel="stylesheet" href="./markdown/vendor.css">
<style>
  :root { color-scheme: light dark; --ink:#18242a; --muted:#59666b; --paper:#fff; --bar:#f1f2ee; --desk:#e4e6df; --line:#d3d6d0; --accent:#357873; --control:#fbfcf8; --hover:#e6e8e2; --tap:34px; --on-accent:#fbfcf8; }
  @media(prefers-color-scheme:dark) { :root { --ink:#efe8d8; --muted:#b3ab9b; --paper:#201e19; --bar:#1b1915; --desk:#12110e; --line:#3a362e; --accent:#85b4ac; --control:#24211c; --hover:#2f2b24; --on-accent:#12110e; } }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--desk); font:16px/1.65 system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; padding:6px 10px; background:var(--bar); border-bottom:1px solid var(--line); font:14px/1.4 system-ui,sans-serif; }
  header button, header summary { font:inherit; color:inherit; border:1px solid var(--line); border-radius:6px; background:var(--control); height:var(--tap); min-width:var(--tap); padding:0 10px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; white-space:nowrap; }
  header :is(button:hover:not(:disabled), summary:hover) { background:var(--hover); }
  header button:disabled { color:var(--muted); cursor:default; }
  .identity { flex:1 1 12em; min-width:0; display:flex; align-items:center; gap:4px; }
  .document-info { min-width:0; }
  #session { flex:none; padding:0; border-color:transparent; background:transparent; }
  #session .dot { box-sizing:content-box; width:10px; height:10px; border:2px solid var(--muted); border-radius:50%; }
  #session[data-state=connected] .dot { background:var(--accent); border-color:var(--accent); }
  #session[data-state=disconnected] .dot { background:linear-gradient(45deg, transparent 42%, var(--muted) 42% 58%, transparent 58%); }
  #name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  #state { display:block; font-size:12px; color:var(--muted); }
  .actions { display:flex; align-items:center; gap:4px; margin-left:auto; }
  #source[aria-pressed=true] { background:var(--ink); border-color:var(--ink); color:var(--on-accent); }
  #options { position:relative; }
  #options > summary { list-style:none; padding:0 8px; }
  #options > summary::-webkit-details-marker { display:none; }
  #options > div { position:absolute; right:0; top:calc(100% + 4px); padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bar); box-shadow:0 4px 12px #0003; }
  #options label { display:flex; align-items:center; gap:6px; min-height:var(--tap); padding:0 4px; white-space:nowrap; }
  #options input { margin:0; accent-color:var(--ink); }
  #notice { flex-basis:100%; color:var(--muted); overflow-wrap:anywhere; }
  #notice:empty { display:none; }
  main { max-width:calc(72ch + 88px); min-height:calc(100vh - 50px); margin:0 auto; padding:32px 44px 25vh; background:var(--paper); overflow-wrap:anywhere; text-autospace:normal; text-spacing-trim:trim-both; line-break:strict; }
  main:lang(en) { hyphens:auto; }
  main:lang(zh), main [lang|="zh"] { font-family:system-ui,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif; line-height:1.8; hyphens:none; }
  h1,h2,h3,h4 { line-height:1.3; scroll-margin-top:100px; }
  a { color:var(--accent); } img { max-width:100%; } pre { overflow:auto; padding:16px; border:1px solid var(--line); border-radius:6px; }
  code { font:0.9em/1.6 ui-monospace,monospace; } :not(pre)>code { background:var(--bar); padding:2px 4px; border-radius:3px; }
  code, .katex { text-autospace:no-autospace; text-spacing-trim:space-all; line-break:auto; hyphens:none; }
  blockquote { border-left:3px solid var(--line); margin-left:0; padding-left:20px; color:var(--muted); }
  table { border-collapse:collapse; display:block; max-width:100%; overflow:auto; } td,th { padding:6px 12px; border:1px solid var(--line); font-variant-numeric:tabular-nums; }
  eqn { display:block; overflow:auto; } .katex-display { overflow-x:auto; overflow-y:hidden; }
  [data-current] { box-shadow:-3px 0 var(--accent); } .locating [data-line] { cursor:crosshair; }
  [data-line] { scroll-margin-top:100px; } hr { border:0; border-top:1px solid var(--line); }
  .task-list-item { list-style:none; } .footnotes { font-size:0.9em; }
  @media(max-width:640px) { main { padding:20px 22px 25vh; } header { gap:4px; padding:4px 8px; } }
  @media(pointer:coarse) { :root { --tap:44px; } }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  header :focus-visible { outline-color:var(--ink); }
</style>
<header aria-label="Markdown controls">
  <div class="identity">
    <button id="session" data-state="connecting" aria-label="Preview session: connecting" title="Connecting to the reader"><span class="dot" aria-hidden="true"></span></button>
    <div class="document-info"><strong id="name">Markdown</strong><span id="state" role="status" aria-atomic="true">Connecting…</span></div>
  </div>
  <div class="actions" role="group" aria-label="Source navigation">
    <button id="source" aria-pressed="false" disabled>Locate in source</button>
    <details id="options"><summary aria-label="More options" title="More options">⋯</summary><div><label title="Keep the editor cursor in view"><input id="follow" type="checkbox">Follow cursor</label></div></details>
  </div>
  <span id="notice" role="status" aria-atomic="true"></span>
</header>
<main id="document" tabindex="0" aria-label="Markdown document"></main>
<script type="module" src="./viewer.mjs"></script>
</html>
