[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "webpreview"
version = "0.1.0"
description = "A unified preview interface for Markdown and LaTeX in Vim"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]

[project.scripts]
webpreview = "webpreview.reader:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
webpreview = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["webpreview"]
namespaces = false
