name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: macos-14
            python: '3.14'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim-nox
      - run: sh tests/run.sh

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y vim-nox latexmk latexdiff poppler-utils \
            texlive-latex-extra texlive-science texlive-luatex texlive-fonts-recommended
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sh tests/run.sh --full
      - run: |
          python -m pip install build
          python -m build
          python tests/distribution.py dist
